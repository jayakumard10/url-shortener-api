[pytest]
pythonpath = .

# --strict-markers turns a *misspelled* marker into an error. It does nothing about a
# *missing* one, which is the failure that actually bites - see the hook in
# tests/conftest.py. Both are needed; neither substitutes for the other.
addopts = --strict-markers

markers =
    unit: no I/O - the subject is exercised in-process
    contract: would this break a consumer of this service? no I/O
    integration: needs a real dependency (an engine, the ASGI stack)
    evaluation: the seam, from the real calling position - needs a broker
